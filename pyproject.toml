[project]
name = "jev-pii"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Paul Hubbard", email = "pfh@phfactor.net" }
]
requires-python = ">=3.12"
dependencies = [
    "faker>=40.41.0",
    "typesafe-sdk[http2]>=0.7.2",
]

[project.scripts]
jev-pii = "jev_pii:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
